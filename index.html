<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Links Mercado Livre</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --ml-yellow: #ffe600;
      --ml-blue: #2d3277;
      --text-main: #333333;
      --text-muted: #666666;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      max-width: 600px;
      margin-bottom: 30px;
    }

    .badge {
      background-color: var(--ml-yellow);
      color: var(--ml-blue);
      font-weight: bold;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 28px;
      color: var(--ml-blue);
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .links-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      background-color: var(--card-bg);
      color: var(--ml-blue);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
      text-align: center;
    }

    .link-card:hover {
      background-color: var(--ml-yellow);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .
